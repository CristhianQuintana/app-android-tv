[versions]
agp = "9.4.1"
kotlin = "2.2.10"
coreKtx = "1.19.1"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
composeBom = "2026.09.00"
tvMaterial = "1.1.0"
coroutines = "1.11.0"
okhttp = "4.12.0"
moshi = "1.15.2"
securityCrypto = "1.1.0"
media3 = "1.11.1"
coil = "2.7.0"
zxing = "3.5.3"
